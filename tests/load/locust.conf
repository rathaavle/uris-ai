# Locust configuration file for URIS-AI load testing
#
# This file contains default configuration for load tests.
# Values can be overridden via command-line arguments.
#
# Requirements: 8.1, 8.2, 8.3

# Test execution settings
users = 500
spawn-rate = 10
run-time = 10m

# Host configuration (override with --host for different environments)
# host = http://localhost:8000

# Web UI settings
web-host = 0.0.0.0
web-port = 8089

# Logging
loglevel = INFO
logfile = tests/load/locust.log

# CSV output for detailed analysis
csv = tests/load/results/load_test
csv-full-history = true

# HTML report
html = tests/load/results/load_test_report.html

# Distributed testing (uncomment for distributed mode)
# master = true
# expect-workers = 4
