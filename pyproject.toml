[tool.poetry]
name = "uris-ai"
version = "0.1.0"
description = "Urban Risk Intelligence System for Flood-Aware Mobility and Public Service Optimization"
authors = ["URIS-AI Team"]
readme = "README.md"
packages = [{include = "uris_ai", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
streamlit = "^1.30.0"
sqlalchemy = "^2.0.25"
pyodbc = "^5.0.1"
azure-storage-blob = "^12.19.0"
azure-identity = "^1.15.0"
azure-keyvault-secrets = "^4.7.0"
azure-ai-ml = "^1.13.0"
azure-functions = "^1.18.0"
azure-monitor-opentelemetry = "^1.2.0"
opencensus-ext-azure = "^1.1.13"
pandas = "^2.2.0"
numpy = "^1.26.3"
scikit-learn = "^1.4.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
redis = "^5.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
folium = "^0.15.1"
streamlit-folium = "^0.15.0"
plotly = "^5.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
hypothesis = "^6.96.1"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"
locust = "^2.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/uris_ai --cov-report=html --cov-report=term"
